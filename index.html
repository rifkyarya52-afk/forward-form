<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LSPD — Detective Case Review & ACC Report</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #1a1d24;
      font-family: Arial, Helvetica, sans-serif;
      color: #1e293b;
      padding: 20px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .form-container {
      width: 100%;
      max-width: 820px;
      background-color: #ffffff;
      border: 1.5px solid #0f172a;
      padding: 30px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    @media (max-width: 600px) {
      .form-container { padding: 15px; }
    }
    .doc-header {
      text-align: center;
      margin-bottom: 15px;
      border-bottom: 2px solid #0f172a;
      padding-bottom: 12px;
    }
    .doc-header img { width: 50px; height: auto; margin-bottom: 4px; }
    .doc-header h1 { font-size: 15px; font-weight: bold; color: #0f172a; text-transform: uppercase; }
    .doc-header h2 { font-size: 12px; font-weight: bold; color: #b91c1c; margin-top: 2px; text-transform: uppercase; letter-spacing: 1px; }

    .status-strip {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      padding: 8px 12px;
      margin-bottom: 12px;
    }
    .status-pill {
      font-size: 11px;
      font-weight: bold;
      padding: 3px 10px;
      border: 2px solid #16a34a;
      color: #16a34a;
      background: #f0fdf4;
      text-transform: uppercase;
    }
    .status-pill.rejected {
      border-color: #dc2626;
      color: #dc2626;
      background: #fef2f2;
    }

    .grid-table {
      width: 100%;
      border: 1px solid #94a3b8;
      background: #ffffff;
      margin-bottom: 12px;
    }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; }
    .row-3 { display: grid; grid-template-columns: 1.2fr 0.9fr 0.9fr; }
    
    @media (max-width: 600px) {
      .row-2, .row-3 { grid-template-columns: 1fr; }
    }

    .cell {
      padding: 6px 9px;
      border-right: 1px solid #cbd5e1;
      border-bottom: 1px solid #cbd5e1;
    }
    .cell:last-child { border-right: none; }
    .no-bottom { border-bottom: none; }

    .cell label {
      display: block;
      font-size: 9px;
      font-weight: bold;
      color: #475569;
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .cell input, .cell select, .cell textarea {
      width: 100%;
      border: none;
      background: transparent;
      font-family: Arial, sans-serif;
      font-size: 12px;
      color: #0f172a;
      outline: none;
    }

    .sec-heading {
      font-size: 10.5px;
      font-weight: bold;
      color: #0f172a;
      text-transform: uppercase;
      margin: 12px 0 4px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-add {
      background: #334155;
      color: #fff;
      border: none;
      font-size: 9.5px;
      font-weight: bold;
      padding: 2px 6px;
      cursor: pointer;
    }

    .narrative-box {
      background: #ffffff;
      border: 1px solid #94a3b8;
      padding: 10px;
      margin-bottom: 12px;
    }
    .narrative-box label {
      display: block;
      font-size: 9.5px;
      font-weight: bold;
      color: #0f172a;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .narrative-box textarea {
      width: 100%;
      min-height: 90px;
      border: none;
      font-family: Arial, sans-serif;
      font-size: 12px;
      line-height: 1.4;
      outline: none;
      resize: vertical;
    }

    .evidence-box {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      padding: 8px;
      margin-bottom: 6px;
    }
    .evidence-preview {
      max-width: 100%;
      max-height: 200px;
      margin-top: 6px;
      display: none;
      border: 1px solid #cbd5e1;
      object-fit: contain;
    }

    .controls {
      width: 100%;
      max-width: 820px;
      margin-top: 15px;
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .act-btn {
      font-size: 11.5px;
      font-weight: bold;
      padding: 9px 14px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      color: #fff;
    }
    .btn-bbcode { background: #0f172a; }
    .btn-discord { background: #4f46e5; }
    .btn-png { background: #d97706; }
    .btn-print { background: #16a34a; }

    @media print {
      body { background: #fff; padding: 0; }
      .form-container { box-shadow: none; border: none; padding: 0; }
      .controls { display: none; }
    }
  </style>
</head>
<body>

<div class="form-container" id="capture-area">
  <div class="doc-header">
    <img src="https://i.imgur.com/3fSSqST.png" alt="LSPD Logo">
    <h1>LOS SANTOS POLICE DEPARTMENT</h1>
    <h2>DETECTIVE BUREAU — INCIDENT REVIEW & ACC REPORT</h2>
  </div>

  <!-- STATUS STRIP -->
  <div class="status-strip">
    <div style="display:flex; align-items:center; gap:8px;">
      <span style="font-size:10px; font-weight:bold; color:#475569;">REVIEW STATUS:</span>
      <span class="status-pill" id="status-pill">ACCEPTED (ACC)</span>
    </div>
    <div style="display:flex; align-items:center; gap:6px;">
      <label style="font-size:10px; font-weight:bold; color:#475569;">KEPUTUSAN:</label>
      <select id="case_status" onchange="changeStatus(this.value)" style="font-size:11px; padding:2px; border:1px solid #94a3b8; cursor:pointer;">
        <option value="ACCEPTED (ACC)">ACCEPTED (ACC)</option>
        <option value="PENDING REVIEW">PENDING REVIEW</option>
        <option value="REJECTED">REJECTED</option>
      </select>
    </div>
  </div>

  <!-- ORIGINAL INCIDENT REFERENCE -->
  <div class="sec-heading"><span>1. ORIGINAL INCIDENT REFERENCE</span></div>
  <div class="grid-table">
    <div class="row-2">
      <div class="cell"><label>INCIDENT TYPE / REF</label><input type="text" id="ref_type" value="Felony Pursuit / Traffic Stop (Aarón Howard)"></div>
      <div class="cell"><label>ORIGINAL INCIDENT DATE</label><input type="text" id="ref_date" value="13 November 2026 - 22:53"></div>
    </div>
    <div class="row-2">
      <div class="cell no-bottom"><label>REPORTING OFFICER ASAL</label><input type="text" id="ref_officer" value="Police Officer II, Einstein Medvic (#41766)"></div>
      <div class="cell no-bottom"><label>DIVISI ASAL</label><input type="text" id="ref_div" value="Harbor Patrol Division"></div>
    </div>
  </div>

  <!-- DETECTIVE ASSESSMENT & FINDINGS -->
  <div class="sec-heading"><span>2. DETECTIVE ASSESSMENT & INVESTIGATIVE NOTES</span></div>
  <div class="narrative-box">
    <label>CASE ANALYSIS & NEXT ACTIONS</label>
    <textarea id="narrative" placeholder="Analisis laporan insiden dari unit patroli. Catat temuan tambahan, arahan penyelidikan lanjutan, atau instruksi pemanggilan tersangka..."></textarea>
  </div>

  <!-- ADDITIONAL DETECTIVE EVIDENCE / SUBMISSION -->
  <div class="sec-heading">
    <span>3. DETECTIVE ADDITIONAL EVIDENCE / EXHIBIT</span>
    <button type="button" class="btn-add" onclick="addEvidence()">+ Bukti Baru</button>
  </div>
  <div id="evidence-list" style="margin-bottom: 12px;">
    <div class="evidence-box">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:6px;">
        <input type="text" class="ev-title" value="Detective Exhibit 1 — CCTV Footage / Warrant Document" style="flex:1; border:none; font-weight:bold; font-size:12px; outline:none;">
        <button type="button" onclick="this.closest('.evidence-box').remove()" style="background:#dc2626; color:#fff; border:none; padding:2px 6px; font-size:10px; cursor:pointer;">✕</button>
      </div>
      <input type="file" accept="image/*" onchange="loadEvidenceImg(event, this)" style="font-size:11px; cursor:pointer; margin-bottom:4px;">
      <img class="evidence-preview" src="" alt="Preview">
    </div>
  </div>

  <!-- REVIEWING DETECTIVE PERSONNEL -->
  <div class="sec-heading"><span>4. REVIEWING DETECTIVE / SUPERVISOR SIGN-OFF</span></div>
  <div class="grid-table">
    <div class="row-3">
      <div class="cell no-bottom"><label>REVIEWING DETECTIVE (NAME & RANK)</label><input type="text" id="det_name" placeholder="Detective Sergeant Name"></div>
      <div class="cell no-bottom"><label>BADGE / SERIAL NO.</label><input type="text" id="det_serial" placeholder="00000"></div>
      <div class="cell no-bottom"><label>REVIEWING DIVISION</label>
        <select id="det_bureau" style="font-size:11px; padding:2px; border:none; background:transparent; width:100%;">
          <option>Major Crime Division</option>
          <option>Major Enforcement Division</option>
          <option>Detective Bureau</option>
          <option>Internal Affairs Division</option>
        </select>
      </div>
    </div>
  </div>
</div>

<!-- CONTROLS -->
<div class="controls">
  <button class="act-btn btn-bbcode" onclick="copyBBCode()">📋 Copy BBCode</button>
  <button class="act-btn btn-discord" onclick="copyDiscord()">💬 Copy Discord</button>
  <button class="act-btn btn-png" onclick="downloadPNG()">📷 Simpan Gambar (PNG)</button>
  <button class="act-btn btn-print" onclick="window.print()">🖨️ Cetak / PDF</button>
</div>

<script>
  function changeStatus(val) {
    const pill = document.getElementById("status-pill");
    pill.textContent = val;
    if (val === "REJECTED") {
      pill.className = "status-pill rejected";
    } else {
      pill.className = "status-pill";
    }
  }

  function loadEvidenceImg(event, input) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      const box = input.closest(".evidence-box");
      const img = box.querySelector(".evidence-preview");
      img.src = e.target.result;
      img.style.display = "block";
    };
    reader.readAsDataURL(file);
  }

  function addEvidence() {
    const list = document.getElementById("evidence-list");
    const box = document.createElement("div");
    box.className = "evidence-box";
    box.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:6px;">
        <input type="text" class="ev-title" value="Detective Exhibit Description" style="flex:1; border:none; font-weight:bold; font-size:12px; outline:none;">
        <button type="button" onclick="this.closest('.evidence-box').remove()" style="background:#dc2626; color:#fff; border:none; padding:2px 6px; font-size:10px; cursor:pointer;">✕</button>
      </div>
      <input type="file" accept="image/*" onchange="loadEvidenceImg(event, this)" style="font-size:11px; cursor:pointer; margin-bottom:4px;">
      <img class="evidence-preview" src="" alt="Preview">
    `;
    list.appendChild(box);
  }

  function copyDiscord() {
    const status = document.getElementById("case_status").value;
    let evs = "";
    document.querySelectorAll(".evidence-box").forEach(box => {
      const title = box.querySelector(".ev-title").value || "-";
      evs += `> - ${title}\n`;
    });

    const txt = `**LOS SANTOS POLICE DEPARTMENT — DETECTIVE CASE REVIEW**
**REVIEW STATUS:** \`${status}\`
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
* **Incident Ref:** ${document.getElementById("ref_type").value || "-"} (${document.getElementById("ref_date").value || "-"})
* **Reporting Officer Asal:** ${document.getElementById("ref_officer").value || "-"} (${document.getElementById("ref_div").value || "-"})

**[DETECTIVE ASSESSMENT & NOTES]**
${document.getElementById("narrative").value || "-"}

**[ADDITIONAL EVIDENCE / EXHIBIT]**
${evs || "> -\n"}
**[REVIEWING PERSONNEL]**
* **Reviewer:** ${document.getElementById("det_name").value || "-"} (#${document.getElementById("det_serial").value || "-"})
* **Division:** ${document.getElementById("det_bureau").value}`;

    navigator.clipboard.writeText(txt).then(() => alert("Format Discord berhasil disalin!"));
  }

  function copyBBCode() {
    const status = document.getElementById("case_status").value;
    let evs = "";
    document.querySelectorAll(".evidence-box").forEach(box => {
      const title = box.querySelector(".ev-title").value || "-";
      evs += `[spoiler=${title}]Lampirkan Link Foto Disini[/spoiler]\n`;
    });

    const bb = `[divbox=white][center][img]https://i.imgur.com/3fSSqST.png[/img]
[b]LOS SANTOS POLICE DEPARTMENT[/b]
[b]DETECTIVE BUREAU — INCIDENT REVIEW & ACC REPORT[/b]
[b]REVIEW STATUS: ${status}[/b][/center]

[b]ORIGINAL INCIDENT REF:[/b] ${document.getElementById("ref_type").value || "-"} | [b]DATE:[/b] ${document.getElementById("ref_date").value || "-"}
[b]REPORTING OFFICER ASAL:[/b] ${document.getElementById("ref_officer").value || "-"} (${document.getElementById("ref_div").value || "-"})

[b]DETECTIVE ASSESSMENT & NOTES[/b]
${document.getElementById("narrative").value || "-"}

[b]ADDITIONAL EVIDENCE / EXHIBIT[/b]
${evs}

[b]REVIEWING DETECTIVE:[/b] ${document.getElementById("det_name").value || "-"} (${document.getElementById("det_serial").value || "-"}) — ${document.getElementById("det_bureau").value}[/divbox]`;

    navigator.clipboard.writeText(bb).then(() => alert("Format BBCode Forum berhasil disalin!"));
  }

  function downloadPNG() {
    const area = document.getElementById("capture-area");
    html2canvas(area, { scale: 2, useCORS: true, allowTaint: true }).then(canvas => {
      const link = document.createElement("a");
      link.download = "LSPD-Detective-Case-Review.png";
      link.href = canvas.toDataURL("image/png");
      link.click();
    }).catch(err => {
      alert("Gagal mengunduh gambar. Silakan gunakan tombol Cetak / PDF.");
      console.error(err);
    });
  }
</script>

</body>
</html>
