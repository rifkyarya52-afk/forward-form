<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LSPD — Incident Report (Detective ACC)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #1a1d24;
      font-family: Arial, Helvetica, sans-serif;
      color: #1e293b;
      padding: 20px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .form-container {
      width: 100%;
      max-width: 820px;
      background-color: #ffffff;
      border: 1.5px solid #64748b;
      padding: 30px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    @media (max-width: 600px) {
      .form-container { padding: 15px; }
    }
    .doc-header {
      text-align: center;
      margin-bottom: 15px;
      border-bottom: 2px solid #0f172a;
      padding-bottom: 12px;
    }
    .doc-header img { width: 50px; height: auto; margin-bottom: 4px; }
    .doc-header h1 { font-size: 15px; font-weight: bold; color: #0f172a; text-transform: uppercase; }
    .doc-header h2 { font-size: 12px; font-weight: bold; color: #334155; margin-top: 2px; text-transform: uppercase; }

    .status-strip {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      padding: 8px 12px;
      margin-bottom: 12px;
    }
    .status-pill {
      font-size: 11px;
      font-weight: bold;
      padding: 3px 10px;
      border: 2px solid #dc2626;
      color: #dc2626;
      background: #fff;
      text-transform: uppercase;
    }
    .status-pill.closed {
      border-color: #16a34a;
      color: #16a34a;
    }

    .grid-table {
      width: 100%;
      border: 1px solid #94a3b8;
      background: #ffffff;
      margin-bottom: 12px;
    }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; }
    .row-3 { display: grid; grid-template-columns: 1.2fr 0.9fr 0.9fr; }
    .row-poi { display: grid; grid-template-columns: 1.5fr 1fr 1fr 30px; }
    
    @media (max-width: 600px) {
      .row-2, .row-3, .row-poi { grid-template-columns: 1fr; }
    }

    .cell {
      padding: 6px 9px;
      border-right: 1px solid #cbd5e1;
      border-bottom: 1px solid #cbd5e1;
    }
    .cell:last-child { border-right: none; }
    .no-bottom { border-bottom: none; }

    .cell label {
      display: block;
      font-size: 9px;
      font-weight: bold;
      color: #475569;
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .cell input, .cell select, .cell textarea {
      width: 100%;
      border: none;
      background: transparent;
      font-family: Arial, sans-serif;
      font-size: 12px;
      color: #0f172a;
      outline: none;
    }

    .sec-heading {
      font-size: 10.5px;
      font-weight: bold;
      color: #0f172a;
      text-transform: uppercase;
      margin: 12px 0 4px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-add {
      background: #334155;
      color: #fff;
      border: none;
      font-size: 9.5px;
      font-weight: bold;
      padding: 2px 6px;
      cursor: pointer;
    }

    .narrative-box {
      background: #ffffff;
      border: 1px solid #94a3b8;
      padding: 10px;
      margin-bottom: 12px;
    }
    .narrative-box label {
      display: block;
      font-size: 9.5px;
      font-weight: bold;
      color: #0f172a;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .narrative-box textarea {
      width: 100%;
      min-height: 90px;
      border: none;
      font-family: Arial, sans-serif;
      font-size: 12px;
      line-height: 1.4;
      outline: none;
      resize: vertical;
    }

    .evidence-box {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      padding: 8px;
      margin-bottom: 6px;
    }
    .evidence-preview {
      max-width: 100%;
      max-height: 200px;
      margin-top: 6px;
      display: none;
      border: 1px solid #cbd5e1;
      object-fit: contain;
    }

    /* DETECTIVE ACC SECTION STYLING */
    .acc-section {
      border: 2px dashed #0f172a;
      background: #f1f5f9;
      padding: 10px;
      margin-top: 15px;
    }
    .acc-title {
      font-size: 10px;
      font-weight: bold;
      color: #0f172a;
      text-transform: uppercase;
      margin-bottom: 6px;
      border-bottom: 1px solid #cbd5e1;
      padding-bottom: 4px;
    }

    .controls {
      width: 100%;
      max-width: 820px;
      margin-top: 15px;
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .act-btn {
      font-size: 11.5px;
      font-weight: bold;
      padding: 9px 14px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      color: #fff;
    }
    .btn-bbcode { background: #0f172a; }
    .btn-discord { background: #4f46e5; }
    .btn-png { background: #d97706; }
    .btn-print { background: #16a34a; }

    @media print {
      body { background: #fff; padding: 0; }
      .form-container { box-shadow: none; border: none; padding: 0; }
      .controls { display: none; }
    }
  </style>
</head>
<body>

<div class="form-container" id="capture-area">
  <div class="doc-header">
    <img src="https://i.imgur.com/3fSSqST.png" alt="LSPD Logo">
    <h1>LOS SANTOS POLICE DEPARTMENT</h1>
    <h2>INCIDENT REPORT</h2>
  </div>

  <!-- STATUS STRIP -->
  <div class="status-strip">
    <div style="display:flex; align-items:center; gap:8px;">
      <span style="font-size:10px; font-weight:bold; color:#475569;">INCIDENT STATUS:</span>
      <span class="status-pill" id="status-pill">OPEN</span>
    </div>
    <div style="display:flex; align-items:center; gap:6px;">
      <label style="font-size:10px; font-weight:bold; color:#475569;">UBAH:</label>
      <select id="case_status" onchange="changeStatus(this.value)" style="font-size:11px; padding:2px; border:1px solid #94a3b8; cursor:pointer;">
        <option value="OPEN">OPEN</option>
        <option value="CLOSED">CLOSED</option>
      </select>
    </div>
  </div>

  <!-- INCIDENT METADATA -->
  <div class="grid-table">
    <div class="row-2">
      <div class="cell no-bottom">
        <label>INCIDENT TYPE</label>
        <input type="text" id="inc_type" placeholder="Traffic Stop / Felony Pursuit / Shooting">
      </div>
      <div class="cell no-bottom">
        <label>DATE & TIME</label>
        <input type="text" id="inc_datetime" placeholder="13 November 2026 - 22:53">
      </div>
    </div>
  </div>
  <div class="grid-table">
    <div class="row-2">
      <div class="cell no-bottom">
        <label>LOCATION</label>
        <input type="text" id="inc_loc" placeholder="Los Santos Freeway">
      </div>
      <div class="cell no-bottom">
        <label>AREA / DIVISION</label>
        <input type="text" id="inc_area" placeholder="Harbor Patrol Division">
      </div>
    </div>
  </div>

  <!-- PERSON(S) OF INTEREST -->
  <div class="sec-heading">
    <span>PERSON(S) OF INTEREST</span>
    <button type="button" class="btn-add" onclick="addPOI()">+ POI</button>
  </div>
  <div class="grid-table" id="poi-table">
    <div class="row-poi poi-row">
      <div class="cell no-bottom"><label>NAME</label><input type="text" class="poi-name" value="Aarón Howard"></div>
      <div class="cell no-bottom"><label>ROLE</label><input type="text" class="poi-role" value="Suspect"></div>
      <div class="cell no-bottom"><label>CONTACT NUMBER</label><input type="text" class="poi-contact" value="N/A"></div>
      <div class="cell no-bottom" style="display:flex; align-items:center; justify-content:center;">
        <button type="button" onclick="this.closest('.poi-row').remove()" style="background:#dc2626; color:#fff; border:none; padding:3px 6px; cursor:pointer;">✕</button>
      </div>
    </div>
  </div>

  <!-- NARRATIVE -->
  <div class="narrative-box">
    <label>NARRATIVE</label>
    <textarea id="narrative" placeholder="On 22:53 13 November 2026, me and Officer Harcovict meet the suspect at the plaza..."></textarea>
  </div>

  <!-- EVIDENCE / BODYCAM FOOTAGE -->
  <div class="sec-heading">
    <span>EVIDENCE / BODYCAM FOOTAGE</span>
    <button type="button" class="btn-add" onclick="addEvidence()">+ Bukti Foto</button>
  </div>
  <div id="evidence-list" style="margin-bottom: 12px;">
    <div class="evidence-box">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:6px;">
        <input type="text" class="ev-title" value="Bodycam Footage of the suspect with ID card" style="flex:1; border:none; font-weight:bold; font-size:12px; outline:none;">
        <button type="button" onclick="this.closest('.evidence-box').remove()" style="background:#dc2626; color:#fff; border:none; padding:2px 6px; font-size:10px; cursor:pointer;">✕</button>
      </div>
      <input type="file" accept="image/*" onchange="loadEvidenceImg(event, this)" style="font-size:11px; cursor:pointer; margin-bottom:4px;">
      <img class="evidence-preview" src="" alt="Preview">
    </div>
  </div>

  <!-- REPORTING OFFICER -->
  <div class="grid-table">
    <div class="row-3">
      <div class="cell no-bottom"><label>REPORTING OFFICER (NAME & RANK)</label><input type="text" id="off_name" value="Police Officer II, Einstein Medvic"></div>
      <div class="cell no-bottom"><label>SERIAL NO.</label><input type="text" id="off_serial" value="41766"></div>
      <div class="cell no-bottom"><label>DIVISION</label><input type="text" id="off_div" value="Harbor Patrol Division"></div>
    </div>
  </div>

  <!-- DETECTIVE / BUREAU ACC / FORWARD SECTION -->
  <div class="acc-section">
    <div class="acc-title">DETECTIVE BUREAU & SPECIALIZED DIVISION REVIEW / ACC</div>
    <div class="grid-3" style="background:#fff; border:1px solid #cbd5e1;">
      <div class="cell"><label>REVIEWING DIVISION</label>
        <select id="acc_div" style="font-size:11px; padding:2px; border:none; background:transparent; width:100%;">
          <option>Major Crime Division</option>
          <option>Major Enforcement Division</option>
          <option>Detective Bureau</option>
          <option>Internal Affairs Division</option>
        </select>
      </div>
      <div class="cell"><label>DETECTIVE / SUPERVISOR ACC</label><input type="text" id="acc_officer" placeholder="Detective Name & Badge"></div>
      <div class="cell"><label>STATUS / ACTION</label>
        <select id="acc_status" style="font-size:11px; padding:2px; border:none; background:transparent; width:100%;">
          <option>ACCEPTED (ACC) & ASSIGNED</option>
          <option>PENDING REVIEW</option>
          <option>FORWARDED / FILED</option>
          <option>REJECTED</option>
        </select>
      </div>
    </div>
    <div style="margin-top:6px;">
      <input type="text" id="acc_notes" placeholder="Notes / Detective Remarks (e.g., Forwarded for further investigation...)" style="width:100%; border:1px solid #cbd5e1; padding:5px; font-size:11px; background:#fff;">
    </div>
  </div>
</div>

<!-- CONTROLS -->
<div class="controls">
  <button class="act-btn btn-bbcode" onclick="copyBBCode()">📋 Copy BBCode</button>
  <button class="act-btn btn-discord" onclick="copyDiscord()">💬 Copy Discord</button>
  <button class="act-btn btn-png" onclick="downloadPNG()">📷 Simpan Gambar (PNG)</button>
  <button class="act-btn btn-print" onclick="window.print()">🖨️ Cetak / PDF</button>
</div>

<script>
  function changeStatus(val) {
    const pill = document.getElementById("status-pill");
    pill.textContent = val;
    if (val === "CLOSED") {
      pill.classList.add("closed");
    } else {
      pill.classList.remove("closed");
    }
  }

  function loadEvidenceImg(event, input) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      const box = input.closest(".evidence-box");
      const img = box.querySelector(".evidence-preview");
      img.src = e.target.result;
      img.style.display = "block";
    };
    reader.readAsDataURL(file);
  }

  function addPOI() {
    const table = document.getElementById("poi-table");
    const row = document.createElement("div");
    row.className = "row-poi poi-row";
    row.style.borderTop = "1px solid #cbd5e1";
    row.innerHTML = `
      <div class="cell no-bottom"><label>NAME</label><input type="text" class="poi-name" placeholder="Suspect Name"></div>
      <div class="cell no-bottom"><label>ROLE</label><input type="text" class="poi-role" value="Suspect"></div>
      <div class="cell no-bottom"><label>CONTACT NUMBER</label><input type="text" class="poi-contact" value="N/A"></div>
      <div class="cell no-bottom" style="display:flex; align-items:center; justify-content:center;">
        <button type="button" onclick="this.closest('.poi-row').remove()" style="background:#dc2626; color:#fff; border:none; padding:3px 6px; cursor:pointer;">✕</button>
      </div>
    `;
    table.appendChild(row);
  }

  function addEvidence() {
    const list = document.getElementById("evidence-list");
    const box = document.createElement("div");
    box.className = "evidence-box";
    box.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:6px;">
        <input type="text" class="ev-title" value="Evidence / Footage Description" style="flex:1; border:none; font-weight:bold; font-size:12px; outline:none;">
        <button type="button" onclick="this.closest('.evidence-box').remove()" style="background:#dc2626; color:#fff; border:none; padding:2px 6px; font-size:10px; cursor:pointer;">✕</button>
      </div>
      <input type="file" accept="image/*" onchange="loadEvidenceImg(event, this)" style="font-size:11px; cursor:pointer; margin-bottom:4px;">
      <img class="evidence-preview" src="" alt="Preview">
    `;
    list.appendChild(box);
  }

  function copyDiscord() {
    const status = document.getElementById("case_status").value;
    let pois = "";
    document.querySelectorAll(".poi-row").forEach(r => {
      const name = r.querySelector(".poi-name").value || "-";
      const role = r.querySelector(".poi-role").value || "-";
      const contact = r.querySelector(".poi-contact").value || "-";
      pois += `> - **${name}** (${role}) — Contact: ${contact}\n`;
    });

    let evs = "";
    document.querySelectorAll(".evidence-box").forEach(box => {
      const title = box.querySelector(".ev-title").value || "-";
      evs += `> - ${title}\n`;
    });

    const txt = `**LOS SANTOS POLICE DEPARTMENT — INCIDENT REPORT**
**STATUS:** \`${status}\`
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
* **Incident Type:** ${document.getElementById("inc_type").value || "-"}
* **Date & Time:** ${document.getElementById("inc_datetime").value || "-"}
* **Location:** ${document.getElementById("inc_loc").value || "-"} | **Area:** ${document.getElementById("inc_area").value || "-"}

**[PERSON(S) OF INTEREST]**
${pois || "> -\n"}
**[NARRATIVE]**
${document.getElementById("narrative").value || "-"}

**[EVIDENCE / FOOTAGE]**
${evs || "> -\n"}
**[REPORTING OFFICER]**
* **Name:** ${document.getElementById("off_name").value || "-"} (#${document.getElementById("off_serial").value || "-"}) — ${document.getElementById("off_div").value || "-"}

**[DETECTIVE ACC / REVIEW]**
* **Reviewing Division:** ${document.getElementById("acc_div").value}
* **Status:** **${document.getElementById("acc_status").value}**
* **Reviewer:** ${document.getElementById("acc_officer").value || "Pending Assignment"}
* **Remarks:** ${document.getElementById("acc_notes").value || "-"}`;

    navigator.clipboard.writeText(txt).then(() => alert("Format Discord berhasil disalin!"));
  }

  function copyBBCode() {
    const status = document.getElementById("case_status").value;
    let pois = "";
    document.querySelectorAll(".poi-row").forEach(r => {
      pois += `[tr][td]${r.querySelector(".poi-name").value}[/td][td]${r.querySelector(".poi-role").value}[/td][td]${r.querySelector(".poi-contact").value}[/td][/tr]\n`;
    });

    let evs = "";
    document.querySelectorAll(".evidence-box").forEach(box => {
      const title = box.querySelector(".ev-title").value || "-";
      evs += `[spoiler=${title}]Lampirkan Link Foto Disini[/spoiler]\n`;
    });

    const bb = `[divbox=white][center][img]https://i.imgur.com/3fSSqST.png[/img]
[b]LOS SANTOS POLICE DEPARTMENT[/b]
[b]INCIDENT REPORT[/b]
[b]STATUS: ${status}[/b][/center]

[b]INCIDENT TYPE:[/b] ${document.getElementById("inc_type").value || "-"} | [b]DATE & TIME:[/b] ${document.getElementById("inc_datetime").value || "-"}
[b]LOCATION:[/b] ${document.getElementById("inc_loc").value || "-"} | [b]AREA:[/b] ${document.getElementById("inc_area").value || "-"}

[b]PERSON(S) OF INTEREST[/b]
[table]${pois}[/table]

[b]NARRATIVE[/b]
${document.getElementById("narrative").value || "-"}

[b]EVIDENCE / BODYCAM FOOTAGE[/b]
${evs}

[b]REPORTING OFFICER:[/b] ${document.getElementById("inc_type").value || "-"} — ${document.getElementById("off_name").value || "-"} (${document.getElementById("off_serial").value || "-"}) — ${document.getElementById("off_div").value || "-"}

[hr]
[b]DETECTIVE & SPECIALIZED DIVISION REVIEW (ACC)[/b]
[b]REVIEWING DIVISION:[/b] ${document.getElementById("acc_div").value}
[b]STATUS:[/b] [color=#16a34a]${document.getElementById("acc_status").value}[/color]
[b]REVIEWER:[/b] ${document.getElementById("acc_officer").value || "Pending"}
[b]REMARKS:[/b] ${document.getElementById("acc_notes").value || "-"}[/divbox]`;

    navigator.clipboard.writeText(bb).then(() => alert("Format BBCode Forum berhasil disalin!"));
  }

  function downloadPNG() {
    const area = document.getElementById("capture-area");
    html2canvas(area, { scale: 2, useCORS: true, allowTaint: true }).then(canvas => {
      const link = document.createElement("a");
      link.download = "LSPD-Incident-Report-Detective-ACC.png";
      link.href = canvas.toDataURL("image/png");
      link.click();
    }).catch(err => {
      alert("Gagal mengunduh gambar. Silakan gunakan tombol Cetak / PDF.");
      console.error(err);
    });
  }
</script>

</body>
  </html>
